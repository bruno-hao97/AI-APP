<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a1a" />
  <meta name="description" content="AI Studio — Nền tảng tạo video, hình ảnh, giọng nói, nhạc AI qua Gommo API" />
  <title>AI Studio — Nền tảng sáng tạo AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body class="app-shell">
  <div class="bg-aurora" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <div class="app-main-wrap">
    <header class="site-header" id="siteHeader">
      <a href="#/" class="site-logo font-display" id="topbarHome">
        <span class="site-logo-mark" aria-hidden="true"></span>
        <span class="site-logo-text">AI STUDIO</span>
      </a>

      <nav class="site-nav" aria-label="Menu chính">
        <a href="#/features" class="site-nav-link" data-topnav="/features">Tính năng</a>
        <a href="#/models" class="site-nav-link" data-topnav="/models">Models</a>
        <a href="#/docs" class="site-nav-link" data-topnav="/docs">Docs</a>
        <a href="#/history" class="site-nav-link" data-topnav="/history">Lịch sử</a>
      </nav>

      <div class="site-header-actions">
        <span class="header-status warn" id="headerStatus" title="Trạng thái API">Chưa có token</span>

        <div class="feature-menu-wrap site-menu-mobile">
          <button type="button" class="feature-menu-trigger" id="featureMenuToggle" aria-expanded="false" aria-haspopup="menu" aria-controls="featureMenuPanel">
            <span id="featureMenuLabel">Menu</span>
            <span class="feature-chevron" aria-hidden="true">▾</span>
          </button>
          <div id="featureMenuBackdrop" class="feature-menu-backdrop" aria-hidden="true"></div>
          <div id="featureMenuPanel" class="feature-menu-panel" role="menu" aria-label="Tính năng"></div>
        </div>

        <a href="#/settings" class="site-link-muted">Token API</a>
        <a href="#/create/image" class="site-cta-btn" id="headerStart">Bắt đầu</a>
      </div>
    </header>

    <main class="app-main" id="app-main"></main>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
